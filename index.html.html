 bí đỏ bao phủ toàn bộ tô cháo."},{stepNumber:4,title:"Nêm bổ sung vi chất & Dầu dinh dưỡng",durationMinutes:1,heatLevel:"Tắt bếp",instruction:"Tắt bếp ngay khi cháo sôi bung đều. Rưới 1 thìa cà phê (5ml) dầu gấc nguyên chất hoặc dầu oliu cho bé, đảo nhẹ cho hòa tan bóng mượt.",chefTip:"Bắt buộc tắt bếp rồi mới cho dầu gấc/dầu oliu để không làm biến chất và giữ trọn vẹn vitamin A, Omega 3-6 quý giá."},{stepNumber:5,title:"Rót đóng hộp & Đóng gói mang về",durationMinutes:1,heatLevel:"Ủ ấm",instruction:"Rót cháo vào hộp nhựa PP 500ml chịu nhiệt, miết chặt nắp kín tránh sánh đổ. Cho vào túi nilông quai xách kèm 1 muỗng nhựa bọc màng và 1 tờ khăn giấy sạch.",chefTip:"Nên để khe hở nhỏ 15 giây trước khi ấn khít nắp nếu cháo quá sôi, tránh hơi nước nóng làm móp méo hộp."}]},{id:"chao-suon-sun-quay",name:"Cháo Sườn Sụn Quẩy Ruốc",tag:"Cháo sườn",description:"Cháo bột gạo xay nhuyễn nấu sườn sụn non, ruốc bông, quẩy giòn và ớt bột",sellingPrice:3e4,items:[{id:"1",name:"Cháo bột gạo tẻ ninh nước xương ống ngọt thanh",cost:2500,category:"base"},{id:"2",name:"Sườn sụn non heo ninh mềm giòn sần sật (50g)",cost:6500,category:"meat"},{id:"3",name:"Quẩy giòn cắt khoanh (1 chiếc)",cost:1500,category:"topping"},{id:"4",name:"Ruốc thịt heo bông sợi xao thơm",cost:1500,category:"topping"},{id:"5",name:"Hành hoa, tiêu bắc, ớt bột, gia vị",cost:600,category:"topping"},{id:"6",name:"Hộp giấy/nhựa mang về + nắp + thìa + túi xách",cost:1300,category:"packaging"}],cookingSteps:[{stepNumber:1,title:"Ninh nước dùng xương ống & Sườn sụn",durationMinutes:60,heatLevel:"Lửa nhỏ",instruction:"Xương ống và sườn sụn heo chần qua nước sôi rửa sạch bọt bẩn. Cho vào nồi ninh cùng củ hành tím nướng và gừng đập dập. Vớt sườn sụn ra khi vừa đạt độ mềm giòn sần sật đặc trưng (khoảng 40 phút), phần xương tiếp tục ninh lấy nước ngọt.",chefTip:"Hớt bọt thường xuyên để nước dùng trong vắt, thơm mùi tủy xương mà không bị tanh."},{stepNumber:2,title:"Khuấy bột gạo tẻ làm cháo sườn phố cổ",durationMinutes:30,heatLevel:"Lửa vừa",instruction:"Bột gạo tẻ xay ướt (hoặc ngâm bột khô với nước lạnh 30 phút). Rót từ từ hỗn hợp bột vào nồi nước xương nóng, một tay rót một tay khuấy liên tục theo chiều kim đồng hồ đến khi bột trong, sánh mượt và dẻo quánh như kem.",chefTip:"Luôn khuấy một chiều và vét sát đáy nồi bằng muôi gỗ hoặc phới dẹt để không bao giờ bị khê khét đáy."},{stepNumber:3,title:"Rim sườn sụn đậm vị",durationMinutes:10,heatLevel:"Lửa nhỏ",instruction:"Sườn sụn thái lát mỏng 0.5cm vừa ăn. Đảo trên chảo với 1 thìa nước mắm ngon cốt cá cơm, tiêu bắc xay và chút xíu đường cho ngấm sâu gia vị rồi trút vào nồi cháo giữ ấm.",chefTip:"Thái lát mỏng giúp khách vừa cắn là cảm nhận được tiếng sụn giòn sần sật mà không hề bị dai cứng."},{stepNumber:4,title:"Chuẩn bị quẩy giòn & Ruốc bông",durationMinutes:5,heatLevel:"Ủ ấm",instruction:"Quẩy mua loại giòn xốp, dùng kéo cắt khoanh dày 1.5cm. Ruốc heo dùng tay xé tơi bông sợi, tiêu bắc xay vỡ hạt dậy mùi thơm.",chefTip:"Nếu quẩy bị ỉu do thời tiết ẩm, cho vào nồi chiên không dầu 160 độ C trong 2 phút sẽ giòn tan như mới ra lò."},{stepNumber:5,title:"Đơm cháo ra hộp & Trang trí",durationMinutes:2,heatLevel:"Tắt bếp",instruction:"Múc 1 muôi đầy cháo sườn bột sánh mịn vào hộp (kèm 50g sườn sụn non). Rắc 1 lớp ruốc heo bông sợi ở giữa, rắc tiêu bắc, hành hoa thái nhỏ, chút ớt bột đỏ và phủ đầy khoanh quẩy vàng ruộm lên trên.",chefTip:"Với đơn mang về xa, nên để quẩy trong túi riêng để giữ độ giòn tan tối đa khi khách ăn."}]},{id:"chao-long-truyen-thong",name:"Cháo Lòng Đầy Đủ Truyền Thống",tag:"Cháo lòng",description:"Cháo ninh tiết đậm đà kèm dồi chiên, lòng non, dạ dày, gan, hành răm",sellingPrice:35e3,items:[{id:"1",name:"Cháo rang thơm ninh nước luộc lòng & tiết",cost:2500,category:"base"},{id:"2",name:"Set lòng dồi luộc (lòng non, dồi, gan, dạ dày 70g)",cost:11e3,category:"meat"},{id:"3",name:"Rau thơm, húng quế, hành hoa, rau răm tươi",cost:1e3,category:"veggie"},{id:"4",name:"Chanh ớt tươi, hạt tiêu, nước mắm chấm",cost:800,category:"topping"},{id:"5",name:"Hộp lớn đựng cháo riêng + túi/hộp đựng lòng",cost:1600,category:"packaging"},{id:"6",name:"Đũa thìa ăn kèm, túi xách",cost:500,category:"packaging"}],cookingSteps:[{stepNumber:1,title:"Sơ chế phủ tạng & Lòng non chuẩn sạch",durationMinutes:30,heatLevel:"Lửa lớn",instruction:"Lòng non vuốt nhẹ với nước muối loãng (không vuốt quá kỹ làm dai lòng). Dạ dày chà xát muối hạt và giấm trắng, cạo sạch màng nhớt. Gan nếp rửa sạch ngâm sữa tươi 15 phút để khử độc và tăng độ ngậy.",chefTip:"Luộc lòng non đúng 3 phút khi nước sôi bùng, vớt ngay thả vào âu nước đá lạnh vắt chanh để lòng trắng phau giòn sần sật."},{stepNumber:2,title:"Nấu dồi heo truyền thống",durationMinutes:40,heatLevel:"Lửa vừa",instruction:"Lòng già nhồi nhân tiết tươi trộn mỡ gáy thái hạt lựu, hành hoa, rau răm, húng quế và chút đậu xanh rang giã dập. Buộc chỉ từng khúc, luộc chín (dùng tăm châm nhẹ cho thoát hơi tránh vỡ), sau đó chiên hoặc nướng sơ cho vỏ ngoài vàng thơm.",chefTip:"Khi luộc dồi, nước vừa sôi lăn tăn là dùng tăm xiên liên tục để dồi không bao giờ bị bục ruột."},{stepNumber:3,title:"Rang gạo & Ninh cháo cùng nước luộc lòng và tiết",durationMinutes:45,heatLevel:"Lửa nhỏ",instruction:"Gạo tẻ rang vàng nhẹ trên chảo gang không dầu cho thơm nức mùi cốm. Đổ vào nồi nước luộc lòng ngọt lịm, ninh nhừ. Khi cháo nở bung thì hòa tiết tươi đánh tan vào quấy đều cho ra màu nâu ánh đồng đặc trưng của cháo lòng.",chefTip:"Rang gạo trước khi nấu là bí quyết sống còn giúp cháo lòng thơm bùi, hạt gạo không bị nát nhừ như cháo bột."},{stepNumber:4,title:"Thái đồ lòng & Chuẩn bị rau ghém",durationMinutes:10,heatLevel:"Ủ ấm",instruction:"Dùng dao thật sắc thái vát mỏng từng miếng dồi, lòng non, dạ dày giòn, gan nếp bùi và dải thịt má. Rau húng quế, ngò gai, hành hoa, rau răm rửa sạch vẩy ráo nước.",chefTip:"Chỉ thái lòng khi có khách gọi món để miếng lòng giữ độ ẩm nóng mọng nước, không bị thâm xỉn khô mặt."},{stepNumber:5,title:"Ra món & Đóng hộp gửi khách",durationMinutes:2,heatLevel:"Tắt bếp",instruction:"Múc cháo tiết sôi bốc khói nghi ngút vào hộp lớn 600ml. Xếp set lòng dồi (70g) lên trên hoặc đóng hộp riêng kèm bịch nước mắm ớt cốt chanh, rau thơm và túi hạt tiêu bắc.",chefTip:"Tặng kèm 1 túi nhỏ quẩy giòn và ớt tươi thái lát sẽ giúp khách đánh giá 5 sao cho quán của bạn."}]},{id:"chao-ga-ta-xe-phay",name:"Cháo Gà Ta Xé Phay Hành Răm",tag:"Cháo gà",description:"Cháo đậu xanh ninh nước luộc gà béo ngọt, thịt đùi ức gà ta xé phay giòn dai",sellingPrice:35e3,items:[{id:"1",name:"Cốt cháo đỗ xanh ninh nước xuýt gà vàng ươm",cost:3e3,category:"base"},{id:"2",name:"Thịt gà ta xé phay (60g)",cost:8500,category:"meat"},{id:"3",name:"Hành lá, rau răm, lá chanh thái chỉ",cost:800,category:"veggie"},{id:"4",name:"Hành khô phi giòn, hạt tiêu bắc, gia vị",cost:900,category:"topping"},{id:"5",name:"Hộp đựng cháo + nắp kèm thìa và túi quai xách",cost:1300,category:"packaging"}],cookingSteps:[{stepNumber:1,title:"Luộc gà ta lấy nước dùng vàng óng",durationMinutes:35,heatLevel:"Lửa nhỏ",instruction:"Chọn gà ta thả vườn thịt chắc da vàng. Cho vào nồi nước lạnh ngập gà cùng 1 củ gừng nướng, 2 củ hành tím đập dập và chút muối hạt. Đun sôi rồi hạ nhỏ lửa 20 phút, tắt bếp ủ thêm 10 phút cho gà chín ngọt từ trong xương.",chefTip:"Vớt gà ra quét nhẹ lớp mỡ gà pha chút bột nghệ lên da rồi ngâm nước đá giúp da gà giòn sần sật và vàng ươm bắt mắt."},{stepNumber:2,title:"Ninh cháo hạt cùng đậu xanh cà vỏ",durationMinutes:40,heatLevel:"Lửa nhỏ",instruction:"Gạo tẻ trộn 1 nắm đậu xanh cà vỏ ngâm mềm. Cho vào nước luộc gà béo ngậy ninh nhừ. Khi cháo nở bung sánh vàng, nêm muối tiêu vừa miệng, giữ ấm trên bếp.",chefTip:"Đậu xanh giúp cháo có độ bùi béo tự nhiên mà không cần dùng nhiều mì chính hay bột ngọt."},{stepNumber:3,title:"Xé phay thịt gà & Phi hành thơm",durationMinutes:10,heatLevel:"Lửa vừa",instruction:"Lọc thịt đùi và ức gà, dùng tay xé phay thành sợi dài vừa ăn (giữ nguyên lớp da giòn đi kèm). Hành tím thái mỏng đều tay, phi ngập dầu đến khi vàng ruộm thì vớt ra giấy thấm dầu.",chefTip:"Xé phay bằng tay giúp thớ thịt gà giữ nguyên độ ngọt mọng nước, ngon hơn hẳn cắt bằng dao."},{stepNumber:4,title:"Thái rau răm & Lá chanh chỉ",durationMinutes:5,heatLevel:"Ủ ấm",instruction:"Lá chanh non rửa sạch cuộn tròn thái chỉ mỏng như sợi cước. Rau răm và hành lá rửa sạch thái nhỏ.",chefTip:"Lá chanh bắt buộc phải thái thật mỏng để lan tỏa hương thơm tinh dầu mà không bị đắng khi ăn."},{stepNumber:5,title:"Hoàn thiện suất cháo gà",durationMinutes:2,heatLevel:"Tắt bếp",instruction:"Múc cháo đậu xanh nóng rẫy vào tô/hộp. Xếp 60g thịt gà ta xé phay lên bề mặt, rắc lá chanh thái chỉ, rau răm hành hoa, 1 thìa hành phi giòn tan và rắc hào phóng tiêu bắc xay cay nồng.",chefTip:"Kèm theo 1 đĩa muối tiêu chanh ớt truyền thống để khách chấm thịt gà."}]},{id:"chao-tom-su-ca-rot",name:"Cháo Tôm Tươi Rau Củ Dinh Dưỡng",tag:"Hải sản",description:"Cháo tôm bóc nõn tươi giã nhuyễn xào hành thơm, cà rốt và hạt sen",sellingPrice:28e3,items:[{id:"1",name:"Cốt cháo hoa gạo tấm thơm nấu nước hầm",cost:2e3,category:"base"},{id:"2",name:"Tôm nõn tươi giã thô xào bơ tỏi/dầu màu (40g)",cost:6500,category:"meat"},{id:"3",name:"Cà rốt xắt hạt lựu & hạt sen hầm nhừ (30g)",cost:1200,category:"veggie"},{id:"4",name:"Dầu mè thơm, hạt nêm, hành phi vàng",cost:700,category:"topping"},{id:"5",name:"Tô/Hộp mang đi + muỗng + bịch nilon",cost:1200,category:"packaging"}],cookingSteps:[{stepNumber:1,title:"Sơ chế & Giã tôm tươi",durationMinutes:15,heatLevel:"Lửa vừa",instruction:"Tôm tươi bóc vỏ, bỏ đầu và rút sợi chỉ đen ở sống lưng. Dùng cối đá giã dập thô (hoặc băm bằng dao). Không xay mịn bằng máy để giữ độ sần sật ngọt thịt.",chefTip:"Ướp tôm với 1 thìa cà phê nước mắm cốt ngon và chút đầu hành đập dập trong 10 phút trước khi xào."},{stepNumber:2,title:"Hấp chín cà rốt & Hạt sen",durationMinutes:20,heatLevel:"Lửa vừa",instruction:"Cà rốt gọt vỏ thái hạt lựu nhỏ li ti (dễ ăn cho cả trẻ em lẫn người lớn). Hạt sen tươi thông tâm đắng, hấp chín mềm bở tơi.",chefTip:"Hấp riêng rau củ giúp giữ nguyên màu sắc cam đỏ rực rỡ và vị ngọt thanh tự nhiên."},{stepNumber:3,title:"Xào tôm thơm lừng lên màu đẹp",durationMinutes:3,heatLevel:"Lửa lớn",instruction:"Bắc chảo nhỏ, cho 1 thìa dầu màu điều hoặc bơ lạt, phi thơm tỏi băm. Trút tôm vào đảo nhanh tay trên lửa lớn trong 90 giây đến khi thịt tôm săn lại và chuyển màu đỏ cam bóng bẩy.",chefTip:"Dầu màu điều giúp tôm có màu cam óng ánh tuyệt đẹp mà hoàn toàn từ thảo mộc thiên nhiên an toàn."},{stepNumber:4,title:"Nấu hòa quyện cùng cốt cháo",durationMinutes:4,heatLevel:"Lửa nhỏ",instruction:"Cho cốt cháo trắng vào nồi nhỏ, trút tôm xào, cà rốt và hạt sen vào cùng. Quấy đều tay trên lửa nhỏ khoảng 3 phút cho các hương vị hòa quyện sâu vào từng hạt cháo dẻo thơm.",chefTip:"Nếm lại và nêm thêm nửa thìa nước mắm ngon để dậy mùi hải sản đặc trưng."},{stepNumber:5,title:"Đóng gói & Phục vụ",durationMinutes:1,heatLevel:"Tắt bếp",instruction:"Múc cháo ra hộp chịu nhiệt, rưới vài giọt dầu mè thơm Nhật Bản, rắc hành ngò thái nhỏ và hành phi thơm vàng giòn.",chefTip:"Vị ngọt của tôm kết hợp với bùi béo của hạt sen tạo nên món cháo bán chạy hàng đầu cho các bà mẹ mua về bồi dưỡng."}]},{id:"chao-thit-bo-hat-sen",name:"Cháo Bò Bằm Hạt Sen Tẩm Bổ",tag:"Thịt bò",description:"Cháo thịt bò thăn băm nhuyễn xào thơm, hạt sen ninh bở tơi tốt cho sức khỏe",sellingPrice:3e4,items:[{id:"1",name:"Cốt cháo ninh nhuyễn dẻo sánh",cost:2e3,category:"base"},{id:"2",name:"Thịt bò thăn tươi bằm (40g)",cost:7500,category:"meat"},{id:"3",name:"Hạt sen tươi ninh mềm bở (20g)",cost:1500,category:"veggie"},{id:"4",name:"Rau mùi tàu/ngò rí, tiêu sọ, dầu ăn dinh dưỡng",cost:800,category:"topping"},{id:"5",name:"Hộp đựng chịu nhiệt + thìa + túi đựng",cost:1200,category:"packaging"}],cookingSteps:[{stepNumber:1,title:"Sơ chế thịt bò thăn mềm mọng",durationMinutes:10,heatLevel:"Lửa lớn",instruction:"Thịt bò thăn chọn miếng tươi màu đỏ mận, băm nhỏ. Ướp với gừng băm nhuyễn, chút tiêu sọ, nước tương và 1 thìa dầu ăn. Trộn đều để th       var currentPreset = presets[0] || { items: [], cookingSteps: [] };

      function renderPresets() {
        var container = document.getElementById('preset-buttons');
        container.innerHTML = '';
        presets.forEach(function(p, idx) {
          var btn = document.createElement('button');
          btn.className = 'btn';
          btn.style.background = (p.id === currentPreset.id) ? '#fef3c7' : '#f5f5f4';
          btn.style.color = (p.id === currentPreset.id) ? '#92400e' : '#44403c';
          btn.style.border = (p.id === currentPreset.id) ? '1px solid #f59e0b' : '1px solid #e7e5e4';
          btn.innerText = p.name;
          btn.onclick = function() {
            currentPreset = p;
            document.getElementById('recipe-name').value = p.name;
            document.getElementById('selling-price').value = p.sellingPrice;
            renderItems();
            renderSteps();
            renderPresets();
          };
          container.appendChild(btn);
        });
      }

      function renderItems() {
        var tbody = document.getElementById('items-tbody');
        tbody.innerHTML = '';
        var totalCost = 0;
        var sellingPrice = parseFloat(document.getElementById('selling-price').value) || 0;
        var boxes = parseInt(document.getElementById('daily-boxes').value, 10) || 50;
        if (boxes < 1) boxes = 1;

        // Update title dynamically
        var titleEl = document.getElementById('cost-card-title');
        if (titleEl) titleEl.innerText = 'Chi Phí Nguyên Liệu & Bao Bì ' + boxes + ' Hộp:';

        var statBatchTitleEl = document.getElementById('stat-batch-profit-title');
        if (statBatchTitleEl) statBatchTitleEl.innerText = 'Tổng Lãi Mẻ ' + boxes + ' Hộp/Ngày';

        (currentPreset.items || []).forEach(function(item) {
          var cost = item.cost || 0;
          totalCost += cost;
          var batchCost = cost * boxes;

          var tr = document.createElement('tr');
          tr.innerHTML = '<td><strong>' + item.name + '</strong></td>' +
            '<td>' + (item.note || 'Theo mẻ') + '</td>' +
            '<td>' + boxes + ' hộp</td>' +
            '<td style="font-weight: bold; color: #b91c1c;">' + Math.round(batchCost).toLocaleString('vi-VN') + ' đ</td>' +
            '<td style="color: #78716c; font-weight: 600;">' + Math.round(cost).toLocaleString('vi-VN') + ' đ</td>';
          tbody.appendChild(tr);
        });

        var profit = sellingPrice - totalCost;
        var margin = sellingPrice > 0 ? (profit / sellingPrice) * 100 : 0;
        var batchProfit = profit * boxes;

        document.getElementById('stat-cogs').innerText = Math.round(totalCost).toLocaleString('vi-VN') + ' đ';
        document.getElementById('stat-profit').innerText = Math.round(profit).toLocaleString('vi-VN') + ' đ';
        document.getElementById('stat-margin').innerText = margin.toFixed(1) + '%';
        var statBatchEl = document.getElementById('stat-batch-profit');
        if (statBatchEl) statBatchEl.innerText = Math.round(batchProfit).toLocaleString('vi-VN') + ' đ';
      }

      function renderSteps() {
        var list = document.getElementById('cooking-steps-list');
        list.innerHTML = '';
        var steps = currentPreset.cookingSteps || [];
        if (steps.length === 0) {
          list.innerHTML = '<p style="color: #a8a29e; font-style: italic;">Chưa có quy trình chế biến cho món này.</p>';
          return;
        }
        steps.forEach(function(s) {
          var div = document.createElement('div');
          div.style.padding = '10px 14px';
          div.style.marginBottom = '8px';
          div.style.background = '#fafaf9';
          div.style.border = '1px solid #e7e5e4';
          div.style.borderRadius = '8px';
          div.innerHTML = '<strong style="color: #d97706;">Bước ' + s.stepNumber + ': ' + s.title + '</strong>' +
            '<p style="font-size: 13px; color: #44403c; margin-top: 4px;">' + (s.instruction || s.description || '') + '</p>';
          list.appendChild(div);
        });
      }

      document.getElementById('selling-price').addEventListener('input', renderItems);
      document.getElementById('daily-boxes').addEventListener('input', renderItems);
      renderPresets();
      renderItems();
      renderSteps();
